# Dense reference at cm=1.3 (41,500 params / 81.05 KB fp16), matching the 0.3362-sparsity point
# of the pruning curves and the largest of the three cm references.
# Checked with nessi.get_torch_size to be a genuinely distinct architecture from cm=1.0
# (63.96 KB) and cm=0.5 (47.15 KB): neighbouring cm values often collapse onto the same channel
# counts because make_divisible floors each stage at 8.
project_name: DCASE24_Task1
experiment_name: scale-down-cm1.3

# dataset
dataset_path: data/tau_scenes_dataset
orig_sample_rate: 44100
subset: 25

# model
n_classes: 10
in_channels: 1
base_channels: 32
channels_multiplier: 1.3
expansion_rate: 2.1

# training
n_epochs: 150
batch_size: 256
lr: 0.005
warmup_steps: 2000
weight_decay: 0.0001

# augmentation
mixstyle_p: 0.4
mixstyle_alpha: 0.3
roll_sec: 0.1

# mel spectrogram
sample_rate: 32000
window_length: 3072
hop_length: 500
n_fft: 4096
n_mels: 256
freqm: 48
timem: 0
f_min: 0
f_max: ~

# system
num_workers: 8
precision: "32"
