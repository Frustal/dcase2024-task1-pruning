# IMP with retrain_epochs raised from imp.yaml's 20 to 35; method notes are in imp.yaml.
# The retrain-length variants exist to separate pruning damage from under-training: SNIP trains
# each level for a full 150 epochs while IMP retrained 20, so any IMP-vs-SNIP gap is confounded
# with budget. 35 is the intermediate probe; imp_retrain150.yaml is the compute-matched end.
project_name: DCASE24_Task1
experiment_name: imp-cm1.8-25pct-retrain35

method: imp

# pruning
source_ckpt: checkpoints/762f0b4fde744636b143bf56646046b7/last.ckpt  # trained cm=1.8, epoch 149/150
sparsities: [0.3362, 0.4860, 0.6333, 0.75, 0.85]
retrain_epochs: 35          # the one value that differs from imp.yaml
retrain_lr: 0.0005          # lr/10, per Han (1/10 for LeNet, 1/100 for AlexNet)
retrain_warmup_steps: 100   # the dense 2000-step warmup is ~20 epochs and would never finish

# dataset
dataset_path: data/tau_scenes_dataset
orig_sample_rate: 44100
subset: 25

# model -- must match the source checkpoint's architecture
n_classes: 10
in_channels: 1
base_channels: 32
channels_multiplier: 1.8
expansion_rate: 2.1

# training (n_epochs/lr are the DENSE recipe; IMP overrides them with the retrain_* values above)
n_epochs: 150
batch_size: 256
lr: 0.005
warmup_steps: 2000
weight_decay: 0.0001

# augmentation
mixstyle_p: 0.4
mixstyle_alpha: 0.3
roll_sec: 0.1

# mel spectrogram
sample_rate: 32000
window_length: 3072
hop_length: 500
n_fft: 4096
n_mels: 256
freqm: 48
timem: 0
f_min: 0
f_max: ~

# system
num_workers: 8
precision: "32"
