# IMP at full retrain length: the compute-matched control. Identical to imp.yaml except
# retrain_epochs 20 -> 150, which makes the curve cost 5 x 150 = 750 epochs, the same total as
# the SNIP curve. It is also the faithful reading of Han et al., who specify a retraining
# learning rate of lr/10 (retrain_lr below) but never a shortened retraining budget.
#
# Residual asymmetry to disclose rather than fix: IMP is iterative, so by level 5 it has seen
# 750 cumulative epochs against SNIP's 150. That is the method as specified, and the cost SNIP
# was invented to avoid.
project_name: DCASE24_Task1
experiment_name: imp150-cm1.8-25pct
method: imp

# pruning
source_ckpt: checkpoints/762f0b4fde744636b143bf56646046b7/last.ckpt  # trained cm=1.8, epoch 149/150
# Same five levels as imp.yaml / snip.yaml / dsp.yaml, so every curve shares an x-axis. The
# first three land the pruned model on the exact parameter count of a dense reference already
# trained (cm=1.3 / cm=1.0 / cm=0.5 at 81.05 / 63.96 / 47.15 KB); the last two (33.82 KB,
# 22.41 KB) go below every dense reference.
sparsities: [0.3362, 0.4860, 0.6333, 0.75, 0.85]
retrain_epochs: 150         # the point of this config; 20 in imp.yaml, 35 in imp_retrain35.yaml
retrain_lr: 0.0005          # lr/10, per Han (1/10 for LeNet, 1/100 for AlexNet)
# Deliberately left at 100 rather than raised to the dense recipe's 2000. The original reason
# for 100 is gone (2000 steps is ~20 epochs, unreachable inside a 20-epoch round), but raising
# it here would make the 20 -> 35 -> 150 series vary two things instead of one, and would
# confound this run against the two IMP curves already measured.
retrain_warmup_steps: 100

# dataset
dataset_path: data/tau_scenes_dataset
orig_sample_rate: 44100
subset: 25

# model -- must match the source checkpoint's architecture
n_classes: 10
in_channels: 1
base_channels: 32
channels_multiplier: 1.8
expansion_rate: 2.1

# training (n_epochs/lr are the DENSE recipe; IMP overrides them with the retrain_* values above)
n_epochs: 150
batch_size: 256
lr: 0.005
warmup_steps: 2000
weight_decay: 0.0001

# augmentation
mixstyle_p: 0.4
mixstyle_alpha: 0.3
roll_sec: 0.1

# mel spectrogram
sample_rate: 32000
window_length: 3072
hop_length: 500
n_fft: 4096
n_mels: 256
freqm: 48
timem: 0
f_min: 0
f_max: ~

# system
num_workers: 8
precision: "32"
