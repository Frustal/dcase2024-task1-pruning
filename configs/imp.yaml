# IMP, iterative magnitude pruning (Han et al. 2015, arXiv:1506.02626).
# Prunes the trained cm=1.8 baseline in rounds, carrying surviving weights forward instead of
# re-initialising them. Layer-wise threshold q * std(W_layer), with q bisected numerically to
# hit each target sparsity rather than hand-tuned, so the curve shares an x-axis with SNIP.
project_name: DCASE24_Task1
experiment_name: imp-cm1.8-25pct
method: imp

# pruning
source_ckpt: checkpoints/762f0b4fde744636b143bf56646046b7/last.ckpt  # trained cm=1.8, epoch 149/150
# Five levels, each one prune->retrain round and one point on the curve, so the whole curve is
# a single job. The first three land the pruned model on the exact parameter count of a dense
# reference already trained (cm=1.3 / cm=1.0 / cm=0.5 at 81.05 / 63.96 / 47.15 KB), making the
# pruned-vs-dense comparison head-to-head at identical size instead of interpolated. The last
# two (33.82 KB, 22.41 KB) go below every dense reference.
sparsities: [0.3362, 0.4860, 0.6333, 0.75, 0.85]
retrain_epochs: 20          # ~13% of the 150-epoch dense schedule
retrain_lr: 0.0005          # lr/10, per Han (1/10 for LeNet, 1/100 for AlexNet)
retrain_warmup_steps: 100   # the dense 2000-step warmup is ~20 epochs and would never finish

# dataset
dataset_path: data/tau_scenes_dataset
orig_sample_rate: 44100
subset: 25

# model -- must match the source checkpoint's architecture
n_classes: 10
in_channels: 1
base_channels: 32
channels_multiplier: 1.8
expansion_rate: 2.1

# training (n_epochs/lr are the DENSE recipe; IMP overrides them with the retrain_* values above)
n_epochs: 150
batch_size: 256
lr: 0.005
warmup_steps: 2000
weight_decay: 0.0001

# augmentation
mixstyle_p: 0.4
mixstyle_alpha: 0.3
roll_sec: 0.1

# mel spectrogram
sample_rate: 32000
window_length: 3072
hop_length: 500
n_fft: 4096
n_mels: 256
freqm: 48
timem: 0
f_min: 0
f_max: ~

# system
num_workers: 8
precision: "32"
