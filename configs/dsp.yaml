# DSP, dynamic structure pruning (Park et al., AAAI 2023, arXiv:2303.09736).
# The only structured method here: IMP and SNIP leave scattered zeros in tensors of unchanged
# shape, worth nothing without sparse kernels, while DSP splits each conv's output filters into
# groups that prune their own input channels, giving a grouped convolution that really shrinks.
#
# Three phases: (A) group learning, one long run learning weights and the filter grouping
# jointly (Gumbel-Softmax over group logits plus a group-lasso penalty, bilevel with one-step
# unrolling, ~2.5-3x a normal epoch); (B) one-shot prune, beta bisected per target size so all
# five curve points come from one phase-A run; (C) finetune, forked per target size.
project_name: DCASE24_Task1
experiment_name: dsp-cm1.8-25pct
method: dsp

# pruning
source_ckpt: checkpoints/762f0b4fde744636b143bf56646046b7/last.ckpt  # trained cm=1.8, epoch 149/150
# Same five levels as IMP and SNIP, so the comparison table has identical rows. These are
# sparsities over ALL 58,440 conv params, the repo-wide convention, not over the 52,864 DSP can
# address and not the reference implementation's internal measure; pruning/dsp.py bisects beta
# against the repo-wide one for that reason.
sparsities: [0.3362, 0.4860, 0.6333, 0.75, 0.85]

# DSP hyperparameters
# g=2 is the paper's ImageNet default, and its ablation shows extra groups buy almost nothing
# on MobileNet-style nets: -31.80 / -31.87 / -31.95% params for g=2/3/4 on MobileNetV2, against
# real range on ResNet50. CP-Mobile's narrowest prunable layer has 32 output filters.
dsp_groups: 2
# lambda. Paper uses 2e-3 (ResNet20 g4) and 5e-4 (ResNet56 g4). It never has to be swept to
# reach a target size, since beta is bisected per target; it only moves accuracy at them.
dsp_reg: 0.002
dsp_tau: 0.5            # Gumbel-Softmax temperature; the reference's default
dsp_group_lr: 0.001     # Adam lr for the group logits only; the reference's default
dsp_group_epochs: 60    # phase A; the reference uses 120 on CIFAR, halved here for cost
dsp_finetune_epochs: 150   # phase C, matching the dense recipe so DSP is compute-comparable
dsp_finetune_lr: 0.0005    # as IMP's retrain_lr -- finetuning, not training from scratch
dsp_finetune_warmup_steps: 100

# Which convs may have whole OUTPUT filters pruned. On CP-Mobile the proj_conv of blocks
# b1/b2/b3/b5 sits under an identity shortcut, so its output width is pinned: zeroing a filter
# still computes correctly but the channel cannot be REMOVED, and counting it as structured
# compression would overstate DSP. "free" restricts filter pruning to b4/b6, the only blocks
# whose output width is unconstrained; "all" reproduces the reference, which handles the
# residual case in packing code not implemented here; "none" disables it.
dsp_fp_mode: free

# Per-layer weighting of the group-lasso penalty. "params" drops the sqrt(activation size)
# factor the reference uses to prune FLOPs preferentially; on CP-Mobile that factor steers
# pruning away from the parameters, which sit late (small but wide layers, where the early ones
# are large but narrow). "flops" restores the reference behaviour.
dsp_penalty_scale: params

# dataset
dataset_path: data/tau_scenes_dataset
orig_sample_rate: 44100
subset: 25

# model -- must match the source checkpoint's architecture
n_classes: 10
in_channels: 1
base_channels: 32
channels_multiplier: 1.8
expansion_rate: 2.1

# training (the DENSE recipe; phase A uses n_epochs->dsp_group_epochs and phase C the
# dsp_finetune_* values above)
n_epochs: 150
batch_size: 256
lr: 0.005
warmup_steps: 2000
weight_decay: 0.0001

# augmentation
mixstyle_p: 0.4
mixstyle_alpha: 0.3
roll_sec: 0.1

# mel spectrogram
sample_rate: 32000
window_length: 3072
hop_length: 500
n_fft: 4096
n_mels: 256
freqm: 48
timem: 0
f_min: 0
f_max: ~

# system
num_workers: 8
precision: "32"
